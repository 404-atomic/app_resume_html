<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenInstall</title>
</head>
<body>
  <script>
    const appKey = "b6tu60";

    function loadOpenInstall(key, onReady) {
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.charset = "UTF-8";
      script.src = `https://res.opstatistics.com/openinstall-${key}.js`;
      script.onload = () => onReady && onReady();
      document.head.appendChild(script);
    }

    function initOpenInstall() {
      if (typeof OpenInstall === "undefined") return;
      const data = OpenInstall.parseUrlParams();
      const instance = new OpenInstall({
        appKey,
        onready: function () {
          this.schemeWakeup();
          this.wakeupOrInstall();
        }
      }, data);
      return instance;
    }

    loadOpenInstall(appKey, initOpenInstall);
  </script>
</body>
</html>
